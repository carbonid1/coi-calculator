[mcp_servers.linear]
command = "pnpm"
args = [
  "dlx",
  "mcp-remote@0.16.6",
  "https://mcp.linear.app/mcp",
  "--authorize-param",
  "prompt=consent",
  "--transport",
  "http-only",
]

[plugins."ai@carbonid1"]
enabled = true

[marketplaces.carbonid1]
source_type = "git"
source = "https://github.com/carbonid1/ai.git"
ref = "main"
